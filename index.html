<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康促進計畫 - 訊息廣播系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="password"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        
        textarea {
            resize: vertical;
            min-height: 150px;
            margin-bottom: 5px;
        }
        
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .char-count {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            white-space: pre-line;
        }
        
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📢 訊息廣播系統</h1>
        <p class="subtitle">健康促進計畫 - 護理師專用</p>
        
        <form id="broadcastForm">
            <label for="password">🔒 密碼</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="請輸入密碼"
                required
                autocomplete="current-password"
            >
            
            <label for="message">廣播內容</label>
            <textarea 
                id="message" 
                name="message" 
                placeholder="請輸入要廣播給所有用戶的訊息..."
                required
                maxlength="5000"
            ></textarea>
            <div class="char-count">
                <span id="charCount">0</span> / 5000 字
            </div>
            
            <button type="submit" id="submitBtn">
                🚀 發送廣播
            </button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">發送中，請稍候...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.edfm.org/webhook/nurse-broadcast';
        
        const form = document.getElementById('broadcastForm');
        const passwordInput = document.getElementById('password');
        const textarea = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        
        // 字數統計
        textarea.addEventListener('input', () => {
            charCount.textContent = textarea.value.length;
        });
        
        // 表單提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = passwordInput.value.trim();
            const message = textarea.value.trim();
            
            if (!password) {
                showResult('請輸入密碼！', 'error');
                return;
            }
            
            if (!message) {
                showResult('請輸入廣播內容！', 'error');
                return;
            }
            
            // 確認對話框
            if (!confirm(`確定要發送以下訊息給所有用戶嗎？\n\n${message.substring(0, 100)}${message.length > 100 ? '...' : ''}`)) {
                return;
            }
            
            // 顯示載入狀態
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        password: password,
                        message: message 
                    })
                });
                
                const data = await response.json();
                
                console.log('收到的回應:', data);
                
                // 處理各種回應狀態
                if (response.status === 401 || data.authenticated === false) {
                    showResult('❌ 密碼錯誤！請檢查後重試', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                } else if (response.ok && data.status === 'success') {
                    const successCount = data.details?.successCount ?? 0;
                    const failedCount = data.details?.failedCount ?? 0;
                    
                    showResult(
                        `✅ 廣播完成！\n成功發送：${successCount} 人\n發送失敗：${failedCount} 人`,
                        'success'
                    );
                    
                    // 清空表單
                    textarea.value = '';
                    charCount.textContent = '0';
                    // 保留密碼，方便連續發送
                } else {
                    showResult(`❌ ${data.message || '發送失敗，請稍後再試'}`, 'error');
                }
            } catch (error) {
                showResult('❌ 網路錯誤，請檢查連線或聯繫管理員', 'error');
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showResult(message, type) {
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
